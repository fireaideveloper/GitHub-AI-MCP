<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="368" viewBox="0 0 1050 368" role="img" aria-labelledby="title desc"><title id="title">Workflow</title><desc id="desc">Plan, preview, review, commit, verify and publish. Approval binds the snapshot; publishing is policy controlled.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c192b"/><stop offset="1" stop-color="#142c44"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#70bfff"/></marker><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#70bfff" stroke-opacity=".055"/></pattern></defs><rect x="1" y="1" width="1048" height="366" rx="24" fill="url(#bg)" stroke="#294760"/><rect x="2" y="2" width="1046" height="364" rx="23" fill="url(#grid)"/><text x="36" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#70bfff" text-anchor="start">02 / CHANGE LIFECYCLE</text><text x="36" y="76" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#f0f7ff" text-anchor="start">From a request to a verified Git tree</text><text x="36" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">One genuinely changed path per commit; explicit publication policy.</text><rect x="36" y="142" width="148" height="128" rx="12" fill="#14283d" stroke="#35536b"/><text x="49" y="169" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#70bfff" text-anchor="start">01</text><text x="49" y="201" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">Plan</text><text x="49" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#a9c1d9" text-anchor="start">Allowlisted paths</text><path d="M184 206 L201 206" stroke="#70bfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="202" y="142" width="148" height="128" rx="12" fill="#14283d" stroke="#35536b"/><text x="215" y="169" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#70bfff" text-anchor="start">02</text><text x="215" y="201" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">Preview</text><text x="215" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#a9c1d9" text-anchor="start">Frozen changes</text><path d="M350 206 L367 206" stroke="#70bfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="368" y="142" width="148" height="128" rx="12" fill="#14283d" stroke="#35536b"/><text x="381" y="169" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#79e5c1" text-anchor="start">03</text><text x="381" y="201" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">Review</text><text x="381" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#a9c1d9" text-anchor="start">Local approval / grant</text><path d="M516 206 L533 206" stroke="#70bfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="534" y="142" width="148" height="128" rx="12" fill="#14283d" stroke="#35536b"/><text x="547" y="169" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#70bfff" text-anchor="start">04</text><text x="547" y="201" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">Commit</text><text x="547" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#a9c1d9" text-anchor="start">One path per commit</text><path d="M682 206 L699 206" stroke="#70bfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="700" y="142" width="148" height="128" rx="12" fill="#14283d" stroke="#35536b"/><text x="713" y="169" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#79e5c1" text-anchor="start">05</text><text x="713" y="201" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">Verify</text><text x="713" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#a9c1d9" text-anchor="start">Tree / required checks</text><path d="M848 206 L865 206" stroke="#70bfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="866" y="142" width="148" height="128" rx="12" fill="#14283d" stroke="#35536b"/><text x="879" y="169" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#70bfff" text-anchor="start">06</text><text x="879" y="201" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">Publish</text><text x="879" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#a9c1d9" text-anchor="start">Permitted branch / PR</text><rect x="36" y="294" width="978" height="48" rx="10" fill="#112e35" stroke="#315a60"/><text x="53" y="324" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#79e5c1" text-anchor="start">APPROVAL BINDS THE SNAPSHOT</text><text x="345" y="324" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">Changed base, paths, tree or messages invalidate the approval.</text></svg>
