<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="435" viewBox="0 0 1050 435" role="img" aria-labelledby="title desc"><title id="title">Security</title><desc id="desc">Repository policy, local approvals, credential isolation, recovery and audit. The local OS account is trusted; host commands are not sandboxed.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c192b"/><stop offset="1" stop-color="#142c44"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#70bfff"/></marker><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#70bfff" stroke-opacity=".055"/></pattern></defs><rect x="1" y="1" width="1048" height="433" rx="24" fill="url(#bg)" stroke="#294760"/><rect x="2" y="2" width="1046" height="431" rx="23" fill="url(#grid)"/><text x="36" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#70bfff" text-anchor="start">03 / SECURITY MODEL</text><text x="36" y="76" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#f0f7ff" text-anchor="start">Trust boundaries, not blind automation</text><text x="36" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">Local policy and operating-system controls define what the AI client can do.</text><rect x="36" y="138" width="478" height="110" rx="14" fill="#13263c" stroke="#28435d"/><text x="54" y="164" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#79e5c1" text-anchor="start">01</text><text x="93" y="165" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">Repository policy</text><text x="93" y="195" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">Allowlisted repositories and paths</text><text x="93" y="217" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">No default-branch or force push</text><rect x="536" y="138" width="478" height="110" rx="14" fill="#13263c" stroke="#28435d"/><text x="554" y="164" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#79e5c1" text-anchor="start">02</text><text x="593" y="165" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">Local approvals</text><text x="593" y="195" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">Snapshot-bound approvals or grants</text><text x="593" y="217" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">Required checks before publication</text><rect x="36" y="264" width="478" height="110" rx="14" fill="#13263c" stroke="#28435d"/><text x="54" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#79e5c1" text-anchor="start">03</text><text x="93" y="291" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">Credential isolation</text><text x="93" y="321" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">OS vault; separate HTTP token</text><text x="93" y="343" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">No credentials in commits or reports</text><rect x="536" y="264" width="478" height="110" rx="14" fill="#13263c" stroke="#28435d"/><text x="554" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#79e5c1" text-anchor="start">04</text><text x="593" y="291" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">Recovery &amp; audit</text><text x="593" y="321" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">SQLite WAL and durable job states</text><text x="593" y="343" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">Metadata audit and ref reconciliation</text><text x="36" y="410" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">Boundary: trusted local OS account; configured host commands are not sandboxed.</text></svg>
