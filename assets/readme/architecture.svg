<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="500" viewBox="0 0 1050 500" role="img" aria-labelledby="title desc"><title id="title">Architecture</title><desc id="desc">Local stdio, authenticated HTTP and private tunnel connect to local policy, job engine and state. Git CLI and GitHub API are the downstream interfaces.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c192b"/><stop offset="1" stop-color="#142c44"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#70bfff"/></marker><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#70bfff" stroke-opacity=".055"/></pattern></defs><rect x="1" y="1" width="1048" height="498" rx="24" fill="url(#bg)" stroke="#294760"/><rect x="2" y="2" width="1046" height="496" rx="23" fill="url(#grid)"/><text x="36" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#70bfff" text-anchor="start">01 / ARCHITECTURE</text><text x="36" y="76" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#f0f7ff" text-anchor="start">From AI client to controlled Git operations</text><text x="36" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">Independent MCP transports converge on the same local service and policy.</text><rect x="36" y="146" width="238" height="86" rx="14" fill="#13263c" stroke="#28435d"/><text x="54" y="178" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">AI / local client</text><text x="54" y="202" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">Local stdio</text><rect x="36" y="250" width="238" height="86" rx="14" fill="#13263c" stroke="#28435d"/><text x="54" y="282" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">AI / HTTP client</text><text x="54" y="306" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">Authenticated loopback</text><rect x="36" y="354" width="238" height="86" rx="14" fill="#13263c" stroke="#28435d"/><text x="54" y="386" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">Cloud AI client</text><text x="54" y="410" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">Official private tunnel</text><rect x="344" y="146" width="330" height="294" rx="14" fill="#13263c" stroke="#28435d"/><text x="362" y="178" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">Local MCP application</text><text x="362" y="202" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">Windows desktop / service</text><rect x="744" y="146" width="270" height="130" rx="14" fill="#13263c" stroke="#28435d"/><text x="762" y="178" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">Git CLI</text><text x="762" y="202" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">Isolated job clones</text><rect x="744" y="310" width="270" height="130" rx="14" fill="#13263c" stroke="#28435d"/><text x="762" y="342" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f0f7ff" text-anchor="start">GitHub API</text><text x="762" y="366" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a9c1d9" text-anchor="start">Repository / PR operations</text><rect x="364" y="235" width="290" height="54" rx="9" fill="#192e45" stroke="#34536d"/><text x="377" y="256" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#70bfff" text-anchor="start">Policy &amp; approval</text><text x="377" y="275" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#a9c1d9" text-anchor="start">Allowlist / snapshot binding</text><rect x="364" y="305" width="290" height="54" rx="9" fill="#192e45" stroke="#34536d"/><text x="377" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#70bfff" text-anchor="start">Job &amp; Git engine</text><text x="377" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#a9c1d9" text-anchor="start">Plan / verify / recover</text><rect x="364" y="375" width="290" height="54" rx="9" fill="#192e45" stroke="#34536d"/><text x="377" y="396" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#70bfff" text-anchor="start">Local state</text><text x="377" y="415" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#a9c1d9" text-anchor="start">OS vault / SQLite / audit</text><path d="M274 189 L344 189" stroke="#70bfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M274 293 L344 293" stroke="#70bfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M274 397 L344 397" stroke="#70bfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M674 211 L744 211" stroke="#70bfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M674 375 L744 375" stroke="#70bfff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="36" y="477" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#a9c1d9" text-anchor="start">Tunnel uses a dedicated stdio process; remote availability requires a real remote read-only check.</text></svg>
