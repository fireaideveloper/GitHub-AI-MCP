[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"
[project]
name = "github-ai-mcp"
version = "1.0.2"
description = "Policy-enforced GitHub development with one changed path per commit"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "httpx==0.28.1", "keyring==25.7.0", "pydantic==2.14.4", "ruamel.yaml==0.19.1", "psutil==7.2.2"]
[project.optional-dependencies]
gui = ["PySide6-Essentials==6.12.0"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10", "mypy==2.4.0"]
[project.scripts]
github-ai-mcp = "github_ai_mcp.cli.app:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
