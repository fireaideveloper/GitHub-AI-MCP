name: Dependency audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install audit tooling
        run: python -m pip install uv==0.12.24 pip-audit==2.10.1
      - name: Validate lockfile
        run: uv lock --check
      - name: Export pinned dependencies
        run: uv export --locked --all-extras --no-emit-project --no-hashes --format requirements-txt --output-file "${RUNNER_TEMP}/locked-requirements.txt"
      - name: Audit locked dependencies
        run: python -m pip_audit --strict --no-deps --disable-pip --requirement "${RUNNER_TEMP}/locked-requirements.txt"
