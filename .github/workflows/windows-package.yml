name: Windows onefile acceptance
on:
  workflow_dispatch:
    inputs:
      runtime_dir:
        description: Reviewed vendor directory on the Windows runner
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    # Vendor artifacts are private explicit build inputs, not unverified downloads.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      RUNTIME_DIR: ${{ inputs.runtime_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.24
      - run: uv sync --frozen --extra gui --extra dev
      - run: uv pip install --python .venv/Scripts/python.exe -r launcher/build-requirements.txt
      - run: .venv/Scripts/python.exe -m pytest -q
      - run: .venv/Scripts/python.exe -m ruff check .
      - run: .venv/Scripts/python.exe -m mypy src
      - run: .venv/Scripts/python.exe scripts/build.py --runtime-dir "$env:RUNTIME_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GitHub-AI-MCP
          if-no-files-found: error
          path: dist/GitHub-AI-MCP.exe
